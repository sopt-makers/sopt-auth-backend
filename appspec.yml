version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu
hooks:
  ApplicationStop:
    - location: script/.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: script/.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: script/.sh
      timeout: 100
      runas: root