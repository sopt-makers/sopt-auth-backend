spring:
  config:
    activate.on-profile:
      - prod
      - dev
      - local
      - test

external:
  gabia:
    sms:
      id: ${GABIA_SMS_ID}
      key: ${GABIA_SMS_KEY}
      url: ${GABIA_SMS_URL}
      phone: ${GABIA_SMS_PHONE}
  oauth:
    apple:
      web-aud: ${APPLE_AUD_WEB}
      app-aud: ${APPLE_AUD_APP}
    google:
      client:
        id: ${GOOGLE_CLIENT_ID}
    magic-login:
      phone: ${MAGIC_LOGIN_PHONE}
      code: ${MAGIC_LOGIN_CODE}
      name: ${MAGIC_LOGIN_NAME}
  playground:
    url: ${PLAYGROUND_BASE_URL}
    key: ${PLAYGROUND_EXTERNAL_KEY}
  app:
    url: ${APP_BASE_URL}
    key: ${APP_EXTERNAL_KEY}
  aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${JWT_KEY_S3_BUCKET}
      public-key-path: ${JWT_PUBLIC_KEY_S3_PATH}
      private-key-path: ${JWT_PRIVATE_KEY_S3_PATH}
