spring.config.activate.on-profile:
  - prod
  - dev
  - local
  - test
external:
  makers:
    playground:
      url: ${PLAYGROUND_URL}
      token: ${PLAYGROUND_TOKEN}
  gabia:
    sms:
      id: ${GABIA_SMS_ID}
      key: ${GABIA_SMS_KEY}
      url: ${GABIA_SMS_URL}
      phone: ${GABIA_SMS_PHONE}
  oauth:
    apple:
      aud: ${APPLE_AUD}
      sub: ${APPLE_SUB}
      key:
        id: ${APPLE_KEY_ID}
        path: ${APPLE_KEY_PATH}
      team:
        id: ${APPLE_TEAM_ID}
      expiration:
        token-expiration: ${APPLE_TOKEN_EXPIRATION_TIME}
    google:
      redirect:
        url: ${GOOGLE_REDIRECT_URL}
      client:
        id: ${GOOGLE_CLIENT_ID}
        secret: ${GOOGLE_CLIENT_SECRET}
