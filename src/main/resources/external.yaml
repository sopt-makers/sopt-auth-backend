external:
  sms:
    internal:
      url: ${SMS_INTERNAL_URL}
      api-key: ${SMS_INTERNAL_API_KEY}
  oauth:
    apple:
      web-aud: ${APPLE_AUD_WEB}
      app-aud: ${APPLE_AUD_APP}
    google:
      client:
        id: ${GOOGLE_CLIENT_ID}
    magic-login:
      phone: ${MAGIC_LOGIN_PHONE}
      code: ${MAGIC_LOGIN_CODE}
      name: ${MAGIC_LOGIN_NAME}
  aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${JWT_KEY_S3_BUCKET}
      public-key-path: ${JWT_PUBLIC_KEY_S3_PATH}
      private-key-path: ${JWT_PRIVATE_KEY_S3_PATH}
