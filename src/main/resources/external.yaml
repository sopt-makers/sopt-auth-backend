spring.config.activate.on-profile: prod
external:
  makers:
    url: ${PROD_PLAYGROUND_URL}
    token: ${PROD_PLAYGROUND_TOKEN}
  gabia:
    sms:
      id: ${GABIA_SMS_ID}
      key: ${GABIA_SMS_KEY}
      url: ${GABIA_SMS_URL}
      phone: ${GABIA_SMS_PHONE}
  oauth:
    apple:
      aud: ${PROD_APPLE_AUD}
      sub: ${PROD_APPLE_SUB}
      key:
        id: ${PROD_APPLE_KEY_ID}
        path: ${PROD_APPLE_KEY_PATH}
      team:
        id: ${PROD_APPLE_TEAM_ID}
    google:
      redirect:
        url: ${PROD_GOOGLE_REDIRECT_URL}
      client:
        id: ${PROD_GOOGLE_CLIENT_ID}
        secret: ${PROD_GOOGLE_CLIENT_SECRET}
---
