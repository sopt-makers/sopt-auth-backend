spring:
  config:
    activate:
      on-profile: test
    import:
      - classpath:jpa.yaml
      - classpath:external.yaml
      - classpath:jwt.yaml
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    #    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: ${LOCAL_DB_DRIVER_CLASS}
    jpa:
      hibernate:
        ddl-auto: create
auth:
  client:
    url: ${LOCAL_AUTH_URL}

rsa:
  public-key: classpath:jwt_public_key.pem
  private-key: classpath:jwt_private_key.pem
