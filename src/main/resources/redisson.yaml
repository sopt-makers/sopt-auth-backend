# Redisson Configuration for Lambda Environment
singleServerConfig:
  address: "redis://${REDIS_HOST:}:${REDIS_PORT:}" # 팀별로 redis port 다름 주의
  password: "${REDIS_PASSWORD:}"
  database: 0

  # Connection Pool (Lambda 동시성 제한 최적화)
  connectionPoolSize: 3
  connectionMinimumIdleSize: 0

  # Timeouts (Cold start 및 빠른 응답 최적화)
  timeout: 3000
  connectTimeout: 2000
  idleConnectionTimeout: 5000

  # Retry 정책
  retryAttempts: 2
  retryInterval: 500

  # Network 설정
  keepAlive: true
  tcpNoDelay: true

  # DNS 캐싱 비활성화 (서버리스 환경 최적화)
  dnsMonitoringInterval: -1

# Resource 최적화 (Thread 최소화)
threads: 2
nettyThreads: 2

# 직렬화 설정
codec: !<org.redisson.codec.JsonJacksonCodec> {}