spring:
  config:
    activate:
      on-profile: local
    import:
      - classpath:jpa.yaml
      - classpath:external.yaml
      - classpath:jwt.yaml
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: ${LOCAL_DB_DRIVER_CLASS}
auth:
  client:
    url: ${LOCAL_AUTH_URL}
