spring:
  config:
    activate:
      on-profile: local
    import:
      - classpath:jpa.yaml
      - classpath:external.yaml
      - classpath:monitoring.yaml
      - classpath:security.yaml
      - classpath:magic-login.yaml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS}
  web:
    resources:
      add-mappings: false
