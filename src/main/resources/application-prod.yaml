spring.profiles.active: prod
spring:
  config:
    activate:
      on-profile: prod
    import:
      - classpath:jpa.yaml
      - classpath:external.yaml
      - classpath:jwt.yaml
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: ${PROD_DB_DRIVER_CLASS}
auth:
  client:
    url: ${PROD_AUTH_URL}
management:
  endpoints:
    web:
      exposure:
        include: health