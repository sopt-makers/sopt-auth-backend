security:
  api:
    keys:
      playground: ${PLAYGROUND_X_API_KEY}
      crew: ${CREW_X_API_KEY}
      app: ${APP_X_API_KEY}
      admin: ${ADMIN_X_API_KEY}
      platform: ${PLATFORM_X_API_KEY}
      monitoring: ${MONITORING_X_API_KEY}
    secured-endpoints:
      - ${GET_PUBLIC_KEY}
      - ${ACTUATOR_PATH}
      - ${USER_PATH}

  jwt:
    secret:
      rsa:
        key-id: ${KEY_ID}
      expiration:
        access-token-expiration: ${ACCESS_TOKEN_EXPIRATION_TIME}
        refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION_TIME}
      issuer:
        issuer-name: ${ISSUER}
    s3:
      bucket: ${JWT_KEY_S3_BUCKET}
      public-key-path: ${JWT_PUBLIC_KEY_S3_PATH}
      private-key-path: ${JWT_PRIVATE_KEY_S3_PATH}
