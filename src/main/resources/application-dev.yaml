spring:
  config:
    activate:
      on-profile: dev
    import:
      - classpath:jpa.yaml
      - classpath:external.yaml
      - classpath:jwt.yaml
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: ${DEV_DB_DRIVER_CLASS}
auth:
  client:
    url: ${DEV_AUTH_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
