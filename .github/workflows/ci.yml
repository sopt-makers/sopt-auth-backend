name: Continuous Integration for SOPT Makers Authentication Project

on:
  pull_request:
    branches: [ dev, prod ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🔑 Create gradle.properties
        run: |
          cat <<EOF > gradle.properties
          ${{ secrets.PROPERTY_GRADLE }}
          EOF

      - name: 🔑 Create .env file
        run: |
          cat <<EOF > .env
          ${{ secrets.ENV_FILE_TEST }}
          EOF

      - name: ✅ Validate env variables
        run: |
          set -e
          source .env

          REQUIRED_VARS=(
            DB_URL
            DB_USERNAME
            DB_PASSWORD
            DB_DRIVER_CLASS
  
            JPA_DATABASE_PLATFORM
            JPA_DATABASE
            
            ACCESS_TOKEN_EXPIRATION_TIME
            REFRESH_TOKEN_EXPIRATION_TIME
            ISSUER
            
            GABIA_SMS_ID
            GABIA_SMS_KEY
            GABIA_SMS_URL
            GABIA_SMS_PHONE
            
            APPLE_AUD_APP
            APPLE_AUD_WEB
            GOOGLE_CLIENT_ID
            
            PLAYGROUND_X_API_KEY
            CREW_X_API_KEY
            APP_X_API_KEY
            ADMIN_X_API_KEY
            PLATFORM_X_API_KEY
            MONITORING_X_API_KEY
            
            JWT_KEY_S3_BUCKET
            JWT_PUBLIC_KEY_S3_PATH
            JWT_PRIVATE_KEY_S3_PATH
            
            ACTUATOR_PATH
            USER_PATH
            MAGIC_LOGIN_PHONE
            MAGIC_LOGIN_CODE
            MAGIC_LOGIN_NAME
            
            PLAYGROUND_EXTERNAL_KEY
            PLAYGROUND_BASE_URL
            APP_EXTERNAL_KEY
            APP_BASE_URL
          )

          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "❌ Missing env: $VAR"
              exit 1
            fi
          done

          echo "✅ Env validation passed"

      - name: 🧱 Build and Test with Gradle
        run: |
          set -e
          source .env
          ./gradlew clean build --no-daemon -Pprofile=test